[versions]
kotlin = "2.1.21"
agp = "8.10.1"
ksp = "2.1.21-2.0.2"
composeBom = "2026.04.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
hilt = "2.57"
hiltNavigationCompose = "1.2.0"
room = "2.7.2"
sqlcipher = "4.16.0"
