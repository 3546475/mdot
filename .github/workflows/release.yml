name: Release

# 推送 v* 标签时：用 CI 密钥签名构建三包 APK → 发布到 Releases → 更新 main 上的 update.json
# update.json 由 GitHub Pages 从 main 分支根目录直接托管（仓库 Settings → Pages → Deploy from branch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 防再犯 v0.6.3/v0.6.4 事故：tag 打在未 bump 版本号的提交上（当时 build.gradle.kts
      # 被 master 的 0.5.10 覆盖），CI 会按错误 versionName 命名 APK/写 update.json。
      # 在构建前快速失败，不走完 7 分钟构建后才暴露。
      - name: "Guard: versionName must match tag"
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "非 tag 触发（workflow_dispatch），跳过校验"
            exit 0
          fi
          VER=$(grep versionName app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/' | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=v${TAG}, versionName=${VER}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::app/build.gradle.kts versionName (${VER}) 与 tag (v${TAG}) 不一致——tag 打在了未 bump 版本号的提交上，拒绝发布"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/mdot-release.keystore
          cat > keystore/keystore.properties <<'EOF'
          storeFile=keystore/mdot-release.keystore
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Run unit tests (quality gate)
        # 13 文档 B8-01：发版前单测门禁。E2E 两例在 CI 无 docs/test-s3.local.properties
        # 时自动跳过（assumeTrue），不会阻塞离线门禁。
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs (v8a / v7a / dual)
        run: |
          VER=$(grep versionName app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/' | head -1)
          VC=$(grep versionCode app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"
          OUT=app/build/outputs/apk/release
          cp "$OUT/app-arm64-v8a-release.apk"   "MDOT-RELEASE-${VER}-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "MDOT-RELEASE-${VER}-v7a.apk"
          cp "$OUT/app-universal-release.apk"   "MDOT-RELEASE-${VER}-dual.apk"

      - name: Prepare release notes (from CHANGELOG.md)
        run: |
          {
            echo "## 更新内容"
            awk -v ver="v${VER}" '$0 ~ "^## " ver {flag=1;next} /^## v/ {flag=0} flag' CHANGELOG.md
            echo ""
            echo "系统要求：Android 10（API 29）及以上。"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 马的加班 v${{ env.VER }}
          body_path: release_notes.md
          files: |
            MDOT-RELEASE-${{ env.VER }}-v8a.apk
            MDOT-RELEASE-${{ env.VER }}-v7a.apk
            MDOT-RELEASE-${{ env.VER }}-dual.apk

      - name: "Generate update.json (sha256 + CHANGELOG notes)"
        # 13 文档 B2-03（三包 sha256，App 端强校验）+ B8-04（releaseNotes 用 CHANGELOG 实际内容）。
        # 生成逻辑在 scripts/gen_update_json.py（可本地跑；避免 YAML heredoc 缩进/转义地雷）。
        env:
          OUT_JSON: ${{ runner.temp }}/update.json
          APK_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ env.VER }}/MDOT-RELEASE-${{ env.VER }}
        run: |
          export SHA_V8A=$(sha256sum "MDOT-RELEASE-${VER}-v8a.apk" | cut -d' ' -f1)
          export SHA_V7A=$(sha256sum "MDOT-RELEASE-${VER}-v7a.apk" | cut -d' ' -f1)
          export SHA_DUAL=$(sha256sum "MDOT-RELEASE-${VER}-dual.apk" | cut -d' ' -f1)
          python3 scripts/gen_update_json.py --notes-file release_notes.md

      - name: Publish update.json to main (GitHub Pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          cp "${{ runner.temp }}/update.json" update.json
          # 节假日库同步（13 文档四-3b 部署缺口修复）：App 默认源指向本仓根目录 holidays.json，
          # 但该文件此前未随分支发布（线上 404，只剩 assets 内置兜底）。权威源 = app assets，
          # 每次发版顺带同步到根目录，dataVersion 比对可保证客户端只在真更新时才拉取。
          cp app/src/main/assets/holidays.json holidays.json
          git add update.json holidays.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
          else
            git commit -m "chore(release): update.json → v${VER} [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          fi
