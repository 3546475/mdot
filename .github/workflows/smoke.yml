name: Smoke
# 构建环境要求（工具链升级后：Kotlin 2.4.20 / AGP 9.4.1 / Gradle 9.6 / KSP 2.3.12 / compileSdk 37）
# - JDK **21**（actions/setup-java 的 java-version）：单测 JVM 需 ≥21 加载 miuix 的 Java 21 字节码类；
#   本地由 gradle.properties 的 org.gradle.java.installations.paths 提供，该路径是 Windows 本机路径、CI 上无效。
# - Android SDK：compileSdk 37（runner 自带 + AGP 按需下载平台；licenses 已接受）。
# - 依赖源：CI 环境变量存在时直连 google()/mavenCentral()（settings.gradle.kts 判定）。

# 推 main 即构建 + 跑单测（13 文档 B8-07）——把"main 能不能编译"变成自动化，
# 而非等发版 tag 才暴露。历史教训：v0.6.12 漏提交 SystemSettingsScreen.kt 致
# public-main 编译必挂，当时无任何 push 触发的构建，问题一路带到发版。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'update.json'
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # ⚠️ 必须 ≥21：miuix 库类是 Java 21 字节码，单测 JVM 用它（AGENTS「JDK 要求」/ docs/11 070）

      - name: Unit tests
        # E2E 两例在 CI 无 docs/test-s3.local.properties 时经 assumeTrue 自动跳过
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
