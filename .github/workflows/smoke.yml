name: Smoke

# 推 main 即构建 + 跑单测（13 文档 B8-07）——把"main 能不能编译"变成自动化，
# 而非等发版 tag 才暴露。历史教训：v0.6.12 漏提交 SystemSettingsScreen.kt 致
# public-main 编译必挂，当时无任何 push 触发的构建，问题一路带到发版。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'update.json'
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests
        # E2E 两例在 CI 无 docs/test-s3.local.properties 时经 assumeTrue 自动跳过
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
